# Litestream — continuously replicates the SQLite DB to S3-compatible storage
# (Backblaze B2, Cloudflare R2, AWS S3…). All values come from env vars set on
# the host, so no secrets live in the repo. Replication is active only when
# LITESTREAM_BUCKET is set (see docker-entrypoint.sh).
dbs:
  - path: /app/data/tossbook.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: tossbook
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        force-path-style: true
