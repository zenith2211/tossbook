# Render blueprint — deploy Toss Book as a Docker web service.
#
# Usage: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# Set ADMIN_USERNAME / ADMIN_PASSWORD in the dashboard before the first deploy.
#
# ── Data persistence ───────────────────────────────────────────────────────
# This app stores everything in a SQLite file at /app/data/tossbook.db.
# The service below runs on the FREE plan, which has EPHEMERAL storage: the
# database is wiped whenever the instance restarts, redeploys, or spins down
# after inactivity. On each fresh start the app re-seeds a single admin from
# ADMIN_USERNAME / ADMIN_PASSWORD, so you can always log back in — but clients,
# matches and bets created at runtime do NOT survive a restart.
#
# To keep data permanently, switch to a paid plan and attach a persistent disk:
#   1. change `plan: free` to `plan: starter` (or higher), and
#   2. uncomment the `disk:` block at the bottom.
# A persistent disk requires a paid instance type.

services:
  - type: web
    name: tossbook
    runtime: docker
    plan: free
    region: singapore # pick the region closest to your users
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: ADMIN_USERNAME
        sync: false # set in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false # set in the Render dashboard (use a long, strong value)
      - key: ADMIN_FLOAT
        value: "1000000000"
      - key: NODE_ENV
        value: production
      # Optional: deliver client deposit/withdraw requests to the admin's Telegram.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: NEXT_PUBLIC_TELEGRAM_ADMIN
        value: RSTOSSBOOK01
      # Litestream: continuously back the SQLite DB up to S3-compatible storage
      # so data survives redeploys on the free (diskless) plan. Set these to
      # enable (B2 / R2 / S3). Leave unset to run without backup.
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
    # disk: # ← uncomment (and use a paid plan) to persist the SQLite database
    #   name: tossbook-data
    #   mountPath: /app/data
    #   sizeGB: 1
