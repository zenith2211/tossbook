# Render blueprint — deploy Toss Book as a Docker web service with a
# persistent disk for the SQLite database.
#
# Usage: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# Set ADMIN_USERNAME / ADMIN_PASSWORD in the dashboard before the first deploy.
#
# NOTE: a persistent disk requires a paid instance type (Starter or higher).
#       The free tier has ephemeral storage and will lose the database.

services:
  - type: web
    name: tossbook
    runtime: docker
    plan: starter
    region: singapore # pick the region closest to your users
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: ADMIN_USERNAME
        sync: false # set in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false # set in the Render dashboard (use a long, strong value)
      - key: ADMIN_FLOAT
        value: "1000000000"
      - key: NODE_ENV
        value: production
    disk:
      name: tossbook-data
      mountPath: /app/data
      sizeGB: 1
